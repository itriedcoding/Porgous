[advisories]
# rsa 0.9.10 (RUSTSEC-2023-0071) is pulled in only by sqlx-mysql, an optional
# sqlx driver. Porgous enables sqlx's sqlite and postgres features only, so the
# MySQL driver and its RSA code are never compiled or reachable. Re-evaluate
# this exception if MySQL support is ever added.
ignore = ["RUSTSEC-2023-0071"]
