name: Finish release

on:
  push:
    branches: ["finish/v0.1.0"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download built release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-dist"
          path: dist
          merge-multiple: true
          run-id: 42454126810
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Validate and write public key
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          pub=$(printf '%s' "${RELEASE_PUBLIC_KEY:-}" | tr -d '[:space:]')
          expected="lAVyQ1BTXGUA3hOqYSDsHaHJXeqw2KhNp2xrW9VvIWw="
          if [ "$pub" != "$expected" ]; then
            echo "::error::RELEASE_PUBLIC_KEY does not match the expected release public key."
            exit 1
          fi
          printf '%s\n' "$pub" > dist/porgous-signing.pub
      - name: Validate signing key, sign, and verify
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          expected="lAVyQ1BTXGUA3hOqYSDsHaHJXeqw2KhNp2xrW9VvIWw="
          key=$(printf '%s' "${RELEASE_SIGNING_KEY:-}" | tr -d '[:space:]')
          if ! printf '%s' "$key" | base64 -d > /tmp/signing.seed 2>/dev/null; then
            echo "::error::RELEASE_SIGNING_KEY is not valid base64."
            exit 1
          fi
          bytes=$(wc -c < /tmp/signing.seed)
          if [ "$bytes" -ne 32 ]; then
            echo "::error::RELEASE_SIGNING_KEY decodes to $bytes bytes; expected 32."
            exit 1
          fi
          { printf '302e020100300506032b657004220420'; xxd -p -c 256 /tmp/signing.seed; } | xxd -r -p > /tmp/signing.der
          openssl pkey -inform DER -in /tmp/signing.der -pubout -outform DER -out /tmp/signing.pub.der
          derived=$(tail -c 32 /tmp/signing.pub.der | base64 -w0)
          if [ "$derived" != "$expected" ]; then
            echo "::error::RELEASE_SIGNING_KEY does not match RELEASE_PUBLIC_KEY; derived public key is $derived."
            exit 1
          fi
          chmod 600 /tmp/signing.seed
          chmod +x dist/porgous-x86_64-linux
          ./dist/porgous-x86_64-linux sign /tmp/signing.seed dist/SHA256SUMS
          base64 -d dist/SHA256SUMS.sig > /tmp/SHA256SUMS.sig.bin
          tail -c 32 /tmp/signing.pub.der > /tmp/signing.pub.raw
          { printf '302a300506032b6570032100'; xxd -p -c 256 /tmp/signing.pub.raw; } | xxd -r -p > /tmp/signing.pub.spki.der
          openssl pkeyutl -verify -pubin -inkey /tmp/signing.pub.spki.der -keyform DER -rawin \
            -in dist/SHA256SUMS -sigfile /tmp/SHA256SUMS.sig.bin
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Porgous v0.1.0
          target_commitish: release/v0.1.0
          files: dist/*
          generate_release_notes: true
          prerelease: false
          body: |
            Porgous v0.1.0

            Linux: `porgous-x86_64-linux.tar.gz`, `.deb`
            Windows: `porgous-windows-x86_64.tar.gz`, portable `.exe`

            Every asset is listed in `SHA256SUMS`; `SHA256SUMS.sig` is the
            Ed25519 signature over that file. Verify it with the included
            `porgous-signing.pub` before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
