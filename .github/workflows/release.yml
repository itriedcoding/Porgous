name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
            VERSION="${VERSION#v}"
          fi
          case "$VERSION" in
            ""|*[!0-9A-Za-z.-]*) echo "::error::Invalid release version '$VERSION'"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Require release signing keys
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not configured; refusing to publish an unsigned release."
            exit 1
          fi
          if [ -z "${RELEASE_PUBLIC_KEY:-}" ]; then
            echo "::error::RELEASE_PUBLIC_KEY is not configured; the signature would not be verifiable."
            exit 1
          fi

  linux:
    needs: [prepare, preflight]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Build binaries
        run: cargo build --release --locked --bin porgous --bin porgous-agent
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m755 target/release/porgous dist/porgous-x86_64-linux
          install -m755 target/release/porgous-agent dist/porgous-agent-x86_64-linux
          install -m644 config/porgous.toml.example dist/porgous.toml.example
          install -m644 packaging/porgous.service dist/porgous.service
          install -m644 README.md LICENSE dist/
          tar -czf dist/porgous-x86_64-linux.tar.gz -C dist \
            porgous-x86_64-linux porgous-agent-x86_64-linux porgous.toml.example porgous.service README.md LICENSE
          bash packaging/build-deb.sh "$VERSION" amd64 target/release/porgous target/release/porgous-agent dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  windows:
    needs: [prepare, preflight]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        shell: bash
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details=$(grep -aE '^(test .* FAILED|failures:|---- .* stdout ----|thread .* panicked|assertion|error\[|error:)' test-output.log | tail -80)
            [ -n "$details" ] || details=$(tail -40 test-output.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/}
            details=${details//$'\n'/'%0A'}
            echo "::error::Windows cargo test failed with exit $status. $details"
          fi
          exit "$status"
      - name: Upload Windows test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: test-output.log
      - name: Build binaries
        shell: bash
        run: cargo build --release --locked --bin porgous --bin porgous-agent
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/porgous.exe dist/porgous-x86_64-windows.exe
          cp target/release/porgous-agent.exe dist/porgous-agent-x86_64-windows.exe
          cp config/porgous.toml.example README.md LICENSE dist/
          tar -czf dist/porgous-windows-x86_64.tar.gz -C dist \
            porgous-x86_64-windows.exe porgous-agent-x86_64-windows.exe porgous.toml.example README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*

  publish:
    needs: [prepare, preflight, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Write public key
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > dist/porgous-signing.pub
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_SIGNING_KEY:-}" ] || { echo "::error::signing key missing"; exit 1; }
          printf '%s' "$RELEASE_SIGNING_KEY" > signing.key
          chmod 600 signing.key
          chmod +x dist/porgous-x86_64-linux
          ./dist/porgous-x86_64-linux sign signing.key dist/SHA256SUMS
          rm -f signing.key
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Porgous v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          body: |
            Porgous v${{ needs.prepare.outputs.version }}

            Linux: `porgous-x86_64-linux.tar.gz`, `.deb`
            Windows: `porgous-windows-x86_64.tar.gz`, portable `.exe`

            Every asset is listed in `SHA256SUMS`; `SHA256SUMS.sig` is the
            Ed25519 signature over that file. Verify it with the included
            `porgous-signing.pub` before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
